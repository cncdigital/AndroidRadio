name: Verificar Android Auto y cache
on:
  push:
    branches: [codex/android-auto-cache]
  pull_request:
    paths: ['android-app/**', '.github/workflows/check-android-cache.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
