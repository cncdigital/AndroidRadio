name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que exista la clave de firma
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::error::Faltan los secrets ANDROID_KEYSTORE_BASE64 y/o ANDROID_KEYSTORE_PASSWORD. Sin la clave permanente el APK no podria actualizarse despues."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/radiosindical.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Habilitar aceleración del emulador
        run: sudo chmod 666 /dev/kvm

      - name: Probar reproducción real en Android
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd "$GITHUB_WORKSPACE/android-app" && gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Mostrar diagnóstico de pruebas Android si fallan
        if: failure()
        run: find app/build/outputs/androidTest-results -name '*.xml' -exec cat {} \\;

      - name: Compilar APK firmado
        env:
          RADIO_SIGNING_STORE_FILE: ${{ runner.temp }}/radiosindical.jks
          RADIO_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RADIO_SIGNING_KEY_ALIAS: radiosindical
          RADIO_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verificar firma
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No se genero un APK firmado"; exit 1; }
          OUT=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"); echo "$OUT"
          echo "$OUT" | grep -qi "SHA-256 digest: 89c6a0e71776d62240dd55bdceed9edbe46fe02b7102ae02d6fafae8d0bf642e" || { echo "::error::El APK no tiene la firma permanente"; exit 1; }

      - name: Leer versión publicada
        id: radio_version
        run: |
          VERSION_CODE=$(grep -E 'versionCode = ' app/build.gradle.kts | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -E 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Conservar APK firmado de esta compilación
        uses: actions/upload-artifact@v4
        with:
          name: RadioSindical-${{ steps.radio_version.outputs.version_name }}
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK en la rama apk
        env:
          RADIO_VERSION_CODE: ${{ steps.radio_version.outputs.version_code }}
          RADIO_VERSION_NAME: ${{ steps.radio_version.outputs.version_name }}
        run: |
          mkdir -p /tmp/apk && cp app/build/outputs/apk/release/app-release.apk /tmp/apk/RadioSindical.apk
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://raw.githubusercontent.com/cncdigital/AndroidRadio/apk/RadioSindical.apk"}\n' "$RADIO_VERSION_CODE" "$RADIO_VERSION_NAME" > /tmp/apk/radio-version.json
          rm -f "$RUNNER_TEMP/radiosindical.jks"
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add RadioSindical.apk radio-version.json
          git commit -qm "APK $RADIO_VERSION_NAME de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
